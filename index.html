<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1613">
<title>홈바 레지스트리 V54</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0F1613; --panel:#18231E; --raise:#1F2C26; --line:#2B3A33;
  --ink:#E9E6DC; --mute:#8FA098; --dim:#5F6F68;
  --amber:#D6A24A; --ok:#62BE93; --ap:#D6A24A; --no:#A8615A;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px; line-height:1.55; font-variant-numeric:tabular-nums;
  padding-bottom:76px;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(214,162,74,.35)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:0 14px}

/* ── 상단 ── */
header{position:sticky;top:0;z-index:20;background:rgba(15,22,19,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding:12px 0 8px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--dim)}
.tally{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.tally div{flex:1;padding:8px 6px;text-align:center;border-right:1px solid var(--line)}
.tally div:last-child{border-right:none}
.tally b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em}
.tally small{font-size:11px;color:var(--mute)}
.t-ok b{color:var(--ok)} .t-ap b{color:var(--ap)} .t-no b{color:var(--no)}

/* ── 탭 ── */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(15,22,19,.97);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex}
nav button{flex:1;padding:11px 4px 12px;font-size:12px;color:var(--mute);
  border-top:2px solid transparent;min-height:48px}
nav button[aria-selected=true]{color:var(--ink);border-top-color:var(--amber);font-weight:600}

/* ── 컨트롤 ── */
.controls{display:flex;flex-wrap:wrap;gap:7px;padding:12px 0}
.controls.strip{flex-wrap:nowrap;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-ms-overflow-style:none}
.controls.strip::-webkit-scrollbar{display:none}
.controls.strip .chip{flex:none}
.controls input[type=search]{flex:1 1 100%;min-width:0;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
.controls input::placeholder{color:var(--dim)}
.chip{padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--raise);color:var(--ink);border-color:#3D5147}
.chip.ok[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.chip.ap[aria-pressed=true]{border-color:var(--ap);color:var(--ap)}
.chip.no[aria-pressed=true]{border-color:var(--no);color:var(--no)}

/* ── 레시피 행 ── */
.list{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:720px){.list{grid-template-columns:1fr 1fr}}
.row{display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--dim);
  border-radius:var(--r);padding:10px 12px}
.row.v2{border-left-color:var(--ok)} .row.v1{border-left-color:var(--ap)} .row.v0{border-left-color:var(--no);opacity:.72}
.row h3{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px}
.row h3 em{font-style:normal;font-size:11px;font-weight:500;color:var(--dim)}
.meta{font-size:12px;color:var(--mute);margin-top:2px}
.meta .mi+.mi{margin-left:11px}
.lack{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.lack span{font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(168,97,90,.16);color:#D08E86}
.lack span.s{background:rgba(214,162,74,.14);color:var(--ap)}
.empty{padding:36px 0;text-align:center;color:var(--dim);font-size:14px}

/* ── 다이얼로그 ── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,10,8,.72);display:none}
.scrim.on{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:41;
  width:min(560px,calc(100vw - 28px));max-height:84vh;overflow:auto;
  background:var(--raise);border:1px solid var(--line);border-radius:14px;
  padding:18px 18px 20px;display:none}
.modal.on{display:block}
.modal h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.modal .sub{font-size:12.5px;color:var(--mute);margin:3px 0 14px}
.modal .sub .mi+.mi{margin-left:11px}
.verdict{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;margin-bottom:12px}
.verdict.v2{background:rgba(98,190,147,.15);color:var(--ok)}
.verdict.v1{background:rgba(214,162,74,.15);color:var(--ap)}
.verdict.v0{background:rgba(168,97,90,.16);color:#D08E86}
.ing{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid rgba(43,58,51,.6);font-size:14px}
.ing:last-of-type{border-bottom:none}
.ing i{font-style:normal;width:15px;flex:none;text-align:center}
.ing .no{color:var(--dim);text-decoration:line-through}
.ing .tag{font-size:11px;color:var(--ap);margin-left:4px}
.ing .opt{font-size:11px;color:var(--dim);margin-left:4px}
.blk{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);white-space:pre-line}
.close{position:absolute;top:12px;right:14px;font-size:22px;line-height:1;color:var(--mute);padding:4px 8px}

/* ── 표 ── */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
tbody tr:hover{background:rgba(31,44,38,.5)}
td.use{white-space:nowrap;color:var(--mute)}
.sechead{font-size:12.5px;font-weight:600;color:var(--amber);padding:16px 0 6px;letter-spacing:.01em}
.tnote{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}

/* ── 재고 ── */
.stockbar{display:flex;gap:7px;flex-wrap:wrap;padding:4px 0 14px}
.grpbox{margin-bottom:14px}
.grpbox h4{font-size:12.5px;font-weight:600;color:var(--amber);margin-bottom:7px}
.items{display:grid;gap:5px;grid-template-columns:1fr}
@media(min-width:560px){.items{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.items{grid-template-columns:1fr 1fr 1fr}}
.it{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;font-size:13.5px;cursor:pointer;min-height:42px}
.it input{width:17px;height:17px;accent-color:var(--amber);flex:none}
.it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{color:var(--dim);font-size:11px;flex:none}
.it.off{opacity:.5}

/* ── 구매 ── */
.rank{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:7px}
.rank b{font-size:20px;font-weight:700;color:var(--amber);min-width:36px;text-align:right;letter-spacing:-.03em}
.rank div{flex:1;min-width:0}
.rank .nm{font-size:14.5px;font-weight:600}
.rank .sub{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}

.mrow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:7px}
.mtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mtop b{font-size:14.5px;font-weight:600}
.ratio{font-size:13px;color:var(--amber);flex:none}
.mnote{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.hint{font-size:12.5px;color:var(--dim);line-height:1.65;padding:2px 0 14px}
.tag-na{color:var(--no)}
.tag-ok{color:var(--ok)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><h1>홈바 레지스트리</h1><span>V54 · 202종</span></div>
    <div class="tally">
      <div class="t-ok"><b id="cOk">0</b><small>정규</small></div>
      <div class="t-ap"><b id="cAp">0</b><small>근사</small></div>
      <div class="t-no"><b id="cNo">0</b><small>불가</small></div>
      <div><b id="cSt">0</b><small>보유 재료</small></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

    <button data-tab="buy">구매</button>

</nav>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

 계란흰자를 넣어 셰이크하는 서양식 변형도 존재."},{"n":"피치 크러시","b":"리큐르","iba":"비IBA","m":"Shake+Build","i":[["피치 슈납스","피치 슈납스 45ml",0,0],["레몬즙","레몬즙 15ml",0,0],["설탕시럽","설탕시럽 15ml",0,0],["크랜베리 주스","크랜베리 주스 75ml",0,0]],"u":"https://www.10000recipe.com/recipe/6889284","note":"만개의레시피 피치크러쉬 —  (원 레시피 사워믹스는 폐기로 레몬+시럽 대체)\n피치 트리(피치 슈납스) 기반의 저도수 프루티 칵테일. 사실상 술은 피치 리큐르만 들어가 도수 5~6%로 낮음. 원 레시피의 스윗앤사워 믹스는 폐기했으므로 레몬즙+설탕시럽으로 대체. 보유 재료로 조주 가능. 크랜베리 양은 취향껏 조절."},{"n":"갓파더 (아마레토)","b":"리큐르","iba":"비IBA","m":"Build","i":[["스카치","스카치 45ml",0,0],["아마레토","아마레토 15ml",0,0]],"u":"https://namu.wiki/w/갓파더(칵테일)","note":"위키 갓파더/디사론노 공식 서술 (1:3~1:2 취향 조절) — \n스카치+디사론노의 1970년대 클래식. IBA 구 등재 갓파더(35:35 동량)와 달리, 커뮤니티 표준은 위스키 주도(3:1). 피트 싱글몰트와 궁합이 좋다고 알려짐. 보유 재료로 조주 가능. ※IBA 버전은 id 6에 별도 존재."},{"n":"아마레토 스톤 사워","b":"리큐르","iba":"비IBA","m":"Shake","i":[["아마레토","아마레토 45ml",0,0],["레몬즙","레몬즙 25ml",0,0],["오렌지 주스","오렌지 주스 25ml",0,0],["설탕시럽","설탕시럽 10ml",0,0]],"u":"https://ko.wikipedia.org/wiki/아마레또_사워","note":"MixBooze/위키 아마레토 사워 — \n아마레토 사워에 오렌지 주스를 더한 '스톤 사워' 변형. 디사론노·레몬·오렌지·시럽 전부 보유 충족되어 조주 가능. 기본 아마레토 사워(id 74)의 부드러운 버전."},{"n":"카시스 오렌지","b":"리큐르","iba":"비IBA","m":"Build","i":[["크렘 드 카시스","크렘 드 카시스 30ml",0,0],["오렌지 주스","오렌지 주스 120ml",0,0]],"u":"","note":"일본식 이자카야 표준 카시스 오렌지 (크렘 드 카시스+OJ 1:4)\n크렘 드 카시스와 오렌지 주스만으로 만드는 저도수 이자카야 클래식. 보유 재료로 조주 가능. 오렌지 대신 우롱차면 카시스 우롱, 소다면 카시스 소다."},{"n":"엔조니","b":"리큐르","iba":"비IBA","m":"Shake","i":[["런던 드라이 진","런던 드라이 진 30ml",0,0],["캄파리","캄파리 30ml",0,0],["레몬즙","레몬즙 15ml",0,0],["설탕시럽","설탕시럽 15ml",0,0]],"u":"","note":"Vincenzo Errico 고안 — 사용자 제공 리큐르 활용 리스트\n네그로니에서 베르무트를 빼고 레몬+시럽으로 바꾼 구조. 베르무트 없이도 캄파리의 쓴맛을 즐길 수 있음."},{"n":"비터 하이볼","b":"리큐르","iba":"비IBA","m":"Build","i":[["버번","버번 30ml",0,0],["캄파리","캄파리 15ml",0,0],["탄산수","탄산수 Full",0,0]],"u":"","note":"사용자 제공 리큐르 활용 리스트\n버번의 단맛과 캄파리의 쓴맛이 소다로 길어지는 미국식 비터 하이볼."},{"n":"재패니즈 슬리퍼","b":"리큐르","iba":"비IBA","m":"Shake","i":[["미도리","미도리 30ml",0,0],["트리플 섹","트리플 섹 30ml",0,0],["레몬즙","레몬즙 30ml",0,0]],"u":"","note":"1980년대 일본 바 유래 — 사용자 제공 리큐르 활용 리스트\n미도리·트리플 /* ══════════ 판정 엔진 ══════════
   정규(2) 필수 재료 전부 보유, 대체 마커 없음
   근사(1) 필수 재료 전부 보유, 대체 마커 있음
   불가(0) 필수 재료 중 미보유 존재
   판정 = 필수 재료 판정의 최솟값. (선택) 재료는 판정에서 제외          */
const ALL = DATA.ings.map(x => x.n);
const OWNER = DATA.ings.filter(x => x.own).map(x => x.n);
const VLABEL = {2:'정규', 1:'근사', 0:'불가'};
const USE = {'시음-축':'시음', '시음-완성':'완성음료', '겸용':'겸용', '조주':'조주', '미활용':'미활용'};

let held = new Set(OWNER);

function evaluate(r){
  const lack = [], sub = [];
  for (const [name,,opt,isSub] of r.i){
    if (opt) continue;
    if (!held.has(name)) lack.push(name);
    else if (isSub) sub.push(name);
  }
  return {lvl: lack.length ? 0 : (sub.length ? 1 : 2), lack, sub};
}

/* ══════════ 저장 ══════════ */
const KEY = 'homebar.v54.held';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify([...held])); }catch(e){} }
function load(){
  try{
    const h = location.hash.match(/^#s=([A-Za-z0-9+/=_-]+)$/);
    if (h) { const s = decode(h[1]); if (s) { held = s; return; } }
    const v = localStorage.getItem(KEY);
    if (v) held = new Set(JSON.parse(v).filter(n => ALL.includes(n)));
  }catch(e){}
}
function encode(){
  let bits = '';
  for (const n of ALL) bits += held.has(n) ? '1' : '0';
  let by = '';
  for (let i=0;i<bits.length;i+=8) by += String.fromCharCode(parseInt(bits.slice(i,i+8).padEnd(8,'0'),2));
  return btoa(by).replace(/\+/g,'-').replace(/\//g,'_');
}
function decode(s){
  try{
    const by = atob(s.replace(/-/g,'+').replace(/_/g,'/'));
    let bits = '';
    for (const ch of by) bits += ch.charCodeAt(0).toString(2).padStart(8,'0');
    return new Set(ALL.filter((n,i) => bits[i] === '1'));
  }catch(e){ return null; }
}

  const c = [0,0,0];

  $('#cOk').textContent = c[2]; $('#cAp').textContent = c[1]; $('#cNo').textContent = c[0];

}

      <div class="meta"><span class="mi">${esc(r.m)}</span><span class="mi">재료 ${r.i.length}종</span>${r.iba !== '비IBA' ? `<span class="mi">${esc(r.iba)}</span>` : ''}</div>
      ${e.lack.length ? `<div class="lack">${e.lack.slice(0,4).map(n => `<span>${esc(n)}</span>`).join('')}${e.lack.length>4?`<span>외 ${e.lack.length-4}</span>`:''}</div>`
        : e.sub.length ? `<div class="lack">${e.sub.map(n => `<span class="s">${esc(n)} 대체</span>`).join('')}</div>` : ''}
    </button>`).join('') + `</div>`
    : `<div class="empty">조건에 맞는 레시피가 없습니다. 필터를 넓혀 보세요.</div>`;

  main.innerHTML = html;
}

function openRecipe(name){
  const r = DATA.recipes.find(x => x.n === name); if (!r) return;
  const e = evaluate(r);
  $('#modal').innerHTML = `
    <button class="close" id="x" aria-label="닫기">&times;</button>
    <h2>${esc(r.n)}</h2>
    <div class="sub"><span class="mi">${esc(r.b)}</span><span class="mi">${esc(r.m)}</span><span class="mi">${esc(r.iba)}</span></div>
    <div class="verdict v${e.lvl}">${VLABEL[e.lvl]}</div>
    ${r.i.map(([n, raw, opt, sub]) => {
      const has = held.has(n);
      const mark = opt ? '○' : has ? (sub ? '◐' : '●') : '✕';
      const col = opt ? 'var(--dim)' : has ? (sub ? 'var(--ap)' : 'var(--ok)') : 'var(--no)';
      return `<div class="ing"><i style="color:${col}">${mark}</i>
        <div class="${!has && !opt ? 'no' : ''}">${esc(raw)}
        ${sub ? '<span class="tag">대체 조주</span>' : ''}${opt ? '<span class="opt">선택</span>' : ''}</div></div>`;
    }).join('')}
    ${(r.note || r.u) ? `<div class="blk">${esc(r.note)}${r.u ? `<br><a href="${esc(r.u)}" target="_blank" rel="noopener">출처 확인</a>` : ''}</div>` : ''}`;
  $('#modal').classList.add('on'); $('#scrim').classList.add('on');
  $('#x').onclick = closeModal;
}
function closeModal(){ $('#modal').classList.remove('on'); $('#scrim').classList.remove('on'); }

/* ══════════ 재고 ══════════ */
function viewStock(){
  let html = `<div class="stockbar">
    <button class="chip" data-s="owner">기본 컬렉션</button>
    <button class="chip" data-s="all">전부 보유</button>
    <button class="chip" data-s="none">전부 해제</button>
    <button class="chip" data-s="share">링크 복사</button>
  </div>
  <p class="hint">체크한 재료만 보유로 계산합니다. 변경 즉시 판정이 다시 계산되고 이 브라우저에 저장됩니다.
  “링크 복사”로 만든 주소를 열면 그 재고 상태가 그대로 재현됩니다.</p>`;

  for (const c of DATA.cats){
    const items = DATA.ings.filter(i => i.c === c);
    if (!items.length) continue;
    html += `<div class="grpbox"><h4>${esc(c)}</h4><div class="items">` + items.map(i => `
      <label class="it ${held.has(i.n) ? '' : 'off'}">
        <input type="checkbox" data-i="${esc(i.n)}" ${held.has(i.n) ? 'checked' : ''}>
        <span>${esc(i.n)}</span><small>${i.q}</small>
      </label>`).join('') + `</div></div>`;
  }
  main.innerHTML = html;
}

/* ══════════ 믹서 ══════════ */
function viewMix(){
  let html = `<p class="hint">기주 1종 + 믹서 1종의 1:N 조합입니다. 재료가 3종 이상이면 레시피 탭에 있습니다.
  비율은 산토리 하이볼 표준(1:3~1:3.5)을 준용한 출발점이므로 기호에 맞게 조정하세요.</p>`;
  let g = null;
  for (const m of DATA.mixers){
    if (m.g !== g){ g = m.g; html += `<div class="sechead">${esc(g)}</div>`; }
    html += `<div class="mrow">
      <div class="mtop"><b>${esc(m.ko)}</b><span class="ratio">${esc(m.ratio)}</span></div>
      <div class="meta">${esc(m.base)} + ${esc(m.mixer)}</div>
      ${m.note ? `<div class="mnote">${esc(m.note)}</div>` : ''}</div>`;
  }
  main.innerHTML = html;
}

/* ══════════ 구매 ══════════ */
function viewBuy(){
  const base = DATA.recipes.map(r => evaluate(r).lvl);
  const missing = ALL.filter(n => !held.has(n));
  const rank = missing.map(n => {
    held.add(n);
    let solo = 0, names = [];
    DATA.recipes.forEach((r,ix) => { if (base[ix] === 0 && evaluate(r).lvl > 0){ solo++; names.push(r.n); } });
    held.delete(n);
    const block = DATA.recipes.filter(r => r.i.some(i => i[0] === n && !i[2])).length;
    return {n, solo, block, names};
  }).filter(x => x.block > 0).sort((a,b) => b.solo - a.solo || b.block - a.block);

  const max = Math.max(1, ...rank.map(x => x.solo));
  main.innerHTML = `<p class="hint">지금 재고에서 <b>그 재료 하나만</b> 더 확보했을 때 불가에서 벗어나는 레시피 수입니다.
  값이 0이어도 막힘 건수가 크면 다른 재료와 함께 사야 열리는 조합입니다.</p>`
    + rank.slice(0,30).map(x => `
      <div class="rank"><b>+${x.solo}</b>
        <div><div class="nm">${esc(x.n)}</div>
          <div class="sub">막힘 ${x.block}건${x.names.length ? ' · ' + esc(x.names.slice(0,3).join(', ')) : ''}</div>
          <div class="bar"><i style="width:${Math.round(x.solo/max*100)}%"></i></div>
        </div></div>`).join('')
    + `<div class="sechead">폐기·소진 기록</div><table><thead><tr><th>품목</th><th>사유</th><th>재구매 시</th></tr></thead><tbody>`
    + DATA.archive.map(a => `<tr><td>${esc(a.ko)}</td><td>${esc(a.why)}</td><td>${esc(a.unlock)}</td></tr>`).join('')
    + `</tbody></table>`;
}

/* ══════════ 컬렉션 ══════════ */
function viewColl(){
  let html = '';
  let g = null;
  for (const b of DATA.bottles){
    if (b.g !== g){
      if (g) html += `</tbody></table>`;
      g = b.g;
      html += `<div class="sechead">${esc(g)}</div><table><thead><tr><th>품목</th><th>도수</th><th>용도</th></tr></thead><tbody>`;
    }
    html += `<tr><td>${esc(b.ko)}${b.qty > 1 ? ` <small style="color:var(--amber)">${b.qty}병</small>` : ''}
      ${b.note ? `<div class="meta">${esc(b.note)}</div>` : ''}</td>
      <td style="white-space:nowrap">${esc(b.abv)}</td><td class="use">${esc(USE[b.use] || b.use)}</td></tr>`;
  }
  html += `</tbody></table>`;

  html += `<div class="sechead">시음 다양성 · 지역 × 숙성</div>
    <table><thead><tr><th>축</th><th>엔트리</th><th>스탠다드</th><th>고숙성 18+</th></tr></thead><tbody>`;
  let mg = null;
  for (const m of DATA.matrix){
    if (m.g !== mg){ mg = m.g; html += `<tr><td colspan="4" style="color:var(--amber);font-size:12px;padding-top:12px">${esc(mg)}</td></tr>`; }
    const cell = v => !v || v === '—' ? `<span style="color:var(--dim)">—</span>`
      : v === '결손' ? `<span class="tag-na">결손</span>` : `<span class="tag-ok">${esc(v)}</span>`;
    html += `<tr><td>${esc(m.axis)}${m.note ? `<div class="meta">${esc(m.note)}</div>` : ''}</td>
      <td>${cell(m.entry)}</td><td>${cell(m.std)}</td><td>${cell(m.aged)}</td></tr>`;
  }
  html += `</tbody></table>
    <div class="sechead">캐스크 축 (보조)</div>
    <table><thead><tr><th>캐스크</th><th>보유</th><th>상태</th></tr></thead><tbody>`
    + DATA.cask.map(c => `<tr><td>${esc(c.axis)}</td><td>${esc(c.have)}</td>
      <td>${c.state === '결손' ? '<span class="tag-na">결손</span>' : `<span class="tag-ok">${esc(c.state)}</span>`}</td></tr>`).join('')
    + `</tbody></table>
    <p class="tnote">시음 축은 조주 해금과 무관합니다. 조주 판단은 레시피 탭과 구매 탭이 담당합니다.</p>`;
  main.innerHTML = html;
}

/* ══════════ 라우팅 ══════════ */
function render(){
  tally();
  ({make: viewMake, stock: viewStock, mix: viewMix, buy: viewBuy, coll: viewColl})[tab]();
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.tab === tab));
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-f],[data-r],[data-s]');
  if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; window.scrollTo(0,0); render(); }
  else if (t.dataset.f){ ({fv:v=>fv=v, fb:v=>fb=v, fi:v=>fi=v})[t.dataset.f](t.dataset.v); render(); }
  else if (t.dataset.r){ openRecipe(t.dataset.r); }
  else if (t.dataset.s){
    const s = t.dataset.s;
    if (s === 'owner') held = new Set(OWNER);
    else if (s === 'all') held = new Set(ALL);
    else if (s === 'none') held = new Set();
    else if (s === 'share'){
      const url = location.origin + location.pathname + '#s=' + encode();
      navigator.clipboard?.writeText(url).then(
        () => { t.textContent = '복사했습니다'; setTimeout(() => t.textContent = '링크 복사', 1600); },
        () => { location.hash = 's=' + encode(); t.textContent = '주소창에서 복사'; });
      return;
    }
    save(); render();
  }
});

document.addEventListener('change', ev => {
  const c = ev.target.closest('[data-i]'); if (!c) return;
  c.checked ? held.add(c.dataset.i) : held.delete(c.dataset.i);
  c.closest('.it').classList.toggle('off', !c.checked);
  save(); tally();
});

document.addEventListener('input', ev => {
  if (ev.target.id !== 'q') return;
  q = ev.target.value;
  const pos = ev.target.selectionStart;
  render();
  const el = $('#q'); if (el){ el.focus(); el.setSelectionRange(pos, pos); }
});

$('#scrim').onclick = closeModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

load(); render();
</script>
</body>
</html>
