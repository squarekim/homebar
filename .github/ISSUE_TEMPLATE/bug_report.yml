name: 버그 제보
description: 동작이 이상하거나 화면이 깨질 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        먼저 **프로필 → 버전**의 값을 확인해 주세요. 이미 고쳐진 버전일 수 있습니다.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 눌렀고, 무엇이 나올 줄 알았고, 실제로 뭐가 나왔는지
      placeholder: |
        1. 술장 → 재고 에서 '데킬라'를 체크했다
        2. 홈바 → 칵테일 에서 마르가리타가 여전히 '불가'로 뜬다
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      description: 프로필 탭 맨 아래 '버전'에 적힌 값
      placeholder: 2026-09-10 14:37 · 1b67ea6
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: 아이폰 15 / 사파리, 또는 윈도우 / 크롬
  - type: textarea
    id: extra
    attributes:
      label: 스크린샷·기타
      description: 이미지를 그대로 붙여넣어도 됩니다
