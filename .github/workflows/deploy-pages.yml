# GitHub Pages 배포 — app/ 을 빌드해 사이트 루트에 올린다.
# 레거시 단일 파일 앱(index.html)은 /legacy/ 로 함께 배포되어 기존 링크가 죽지 않는다.
#
# 프로필
#   beta   (기본) 오너의 홈바(보유 주류·재고)가 들어간 채로 공개. 방문자가 바꾼 값은 방문자 브라우저에만 남는다.
#   public        개인 데이터를 뺀 정식 공개판. 기본 홈바 세트로 시작한다.
# 정식 공개로 넘어갈 때는 Actions 에서 profile=public 으로 수동 실행하거나 아래 DEFAULT_PROFILE 을 바꾼다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']     # 작업 브랜치에 푸시하면 그대로 베타가 갱신된다
    paths: ['app/**', 'index.html', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: '배포 프로필 (beta = 내 술 포함, public = 개인 데이터 제외)'
        type: choice
        options: [beta, public]
        default: beta

env:
  DEFAULT_PROFILE: beta

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        env:
          PROFILE: ${{ github.event.inputs.profile || '' }}
        run: |
          PROFILE="${PROFILE:-$DEFAULT_PROFILE}"
          echo "profile=$PROFILE"
          if [ "$PROFILE" = "public" ]; then
            npm run build:public
            echo "OUT=dist-public" >> "$GITHUB_ENV"
          else
            npm run build
            echo "OUT=dist" >> "$GITHUB_ENV"
          fi
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/legacy
          cp -r "app/$OUT/." _site/
          cp index.html _site/legacy/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
