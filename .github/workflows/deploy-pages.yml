# GitHub Pages 배포 — app/ 을 빌드해 사이트 루트에 올린다.
# 레거시 단일 파일 앱(index.html)은 /legacy/ 로 함께 배포되어 기존 링크가 죽지 않는다.
#
# 프로필
#   beta   (기본) 오너의 홈바(보유 주류·재고)가 들어간 채로 배포. 지금은 내부 확인용.
#   public        개인 데이터를 뺀 정식 공개판. 기본 홈바 세트로 시작한다.
# 정식 공개 때는 Actions 에서 profile=public 으로 실행한다.
name: Deploy to GitHub Pages

# 정식 공개 전까지 자동 배포는 꺼 둔다. 푸시로는 아무것도 게시되지 않고,
# 올릴 때만 Actions 탭에서 "Run workflow" 로 직접 실행한다.
# 공개 단계로 넘어가면 아래 push 블록의 주석을 풀면 된다.
on:
  # push:
  #   branches: [main]
  #   paths: ['app/**', 'index.html', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: '배포 프로필 (beta = 내 술 포함, public = 개인 데이터 제외)'
        type: choice
        options: [beta, public]
        default: beta

env:
  DEFAULT_PROFILE: beta

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        env:
          PROFILE: ${{ github.event.inputs.profile || '' }}
        run: |
          PROFILE="${PROFILE:-$DEFAULT_PROFILE}"
          echo "profile=$PROFILE"
          if [ "$PROFILE" = "public" ]; then
            npm run build:public
            echo "OUT=dist-public" >> "$GITHUB_ENV"
          else
            npm run build
            echo "OUT=dist" >> "$GITHUB_ENV"
          fi
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/legacy
          cp -r "app/$OUT/." _site/
          cp index.html _site/legacy/index.html
      # enablement: Pages 빌드 타입을 'GitHub Actions' 로 되돌린다.
      # 브랜치 소스로 남아 있으면 main 푸시마다 Jekyll 이 레포 루트(=레거시 index.html)를 덮어쓰기 때문.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
