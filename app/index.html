<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <meta name="theme-color" content="#F6F4EF" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!-- 글꼴은 앱에 함께 넣었다(src/assets/fonts/fonts.css). 외부 글꼴 서버에 의존하지 않는다 -->
  <title>홈바</title>
  <meta name="description" content="집에 있는 술과 재료를 체크하면 지금 만들 수 있는 칵테일과 모자란 재료를 알려 줘요." />
  <!-- 카카오톡·슬랙 등에 링크를 붙였을 때 뜨는 미리보기. 절대 URL 이어야 해서 배포 주소를 적는다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="홈바" />
  <meta property="og:title" content="홈바 — 지금 내 술로 뭘 만들 수 있을까" />
  <meta property="og:description" content="가진 재료를 체크하면 바로 만들 수 있는 잔, 대체 재료로 되는 잔, 재료가 모자란 잔으로 나눠 보여 줘요." />
  <meta property="og:url" content="https://squarekim.github.io/homebar/" />
  <meta property="og:image" content="https://squarekim.github.io/homebar/icon-512.png" />
  <meta name="twitter:card" content="summary" />
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</html>
